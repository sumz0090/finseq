name: Build KIRAN OMS APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "KIRAN_OMS_Android/**"
      - ".github/workflows/build-kiran-oms-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      SDKMANAGER: /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses
        run: |
          yes | "$SDKMANAGER" --licenses >/dev/null || true

      - name: Install Android SDK packages
        run: |
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: KIRAN_OMS_Android
        run: |
          gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: |
          cp KIRAN_OMS_Android/app/build/outputs/apk/debug/app-debug.apk KIRAN_OMS_Android_V1.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KIRAN-OMS-Android-APK
          path: KIRAN_OMS_Android_V1.apk
          if-no-files-found: error
          retention-days: 30
