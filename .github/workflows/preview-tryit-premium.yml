name: Preview TRYIT Premium design
on:
  push:
    branches: [tryit-native-phase-a-20261010]
    paths: ['.github/workflows/preview-tryit-premium.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
          cache-read-only: false
      - name: Prepare preview collector
        run: |
          cat > collect_previews.py <<'PY'
          import os, subprocess, time
          from pathlib import Path
          directory=Path('premium-previews');directory.mkdir(exist_ok=True)
          pending=set(('dashboard','workspace','login'))
          deadline=time.monotonic()+600
          while pending and time.monotonic()<deadline:
              for name in list(pending):
                  result=subprocess.run(['adb','exec-out','run-as','com.tryitexclusive.nativepilot','cat','files/premium_'+name+'.png'],capture_output=True)
                  if result.returncode==0 and result.stdout.startswith(b'\x89PNG\r\n\x1a\n'):
                      temporary=directory/(name+'.tmp')
                      temporary.write_bytes(result.stdout)
                      os.replace(temporary,directory/(name+'.png'))
                      pending.remove(name)
              if pending: time.sleep(.2)
          if pending: raise SystemExit('Preview capture incomplete')
          PY
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            python collect_previews.py &
            cd tryit-native-phase-a && gradle --no-daemon :app:connectedDebugAndroidTest
            python -c "from pathlib import Path; assert all((Path('premium-previews')/(name+'.png')).read_bytes().startswith(bytes((137,80,78,71))) for name in ('dashboard','workspace','login'))"
      - uses: actions/upload-artifact@v4
        with:
          name: TRYIT-Premium-Design-Previews
          path: premium-previews/*.png
          if-no-files-found: error
