name: Preview TRYIT Premium design
on:
  push:
    branches: [tryit-native-phase-a-20261010]
    paths: ['.github/workflows/preview-tryit-premium.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
          cache-read-only: false
      - name: Retain isolated fixture previews before test cleanup
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tryit-native-phase-a/app/src/androidTest/java/com/tryitexclusive/nativepilot/NativePilotUiTest.kt')
          s=p.read_text()
          marker='        compose.runOnIdle { compose.activity.window.addFlags(WindowManager.LayoutParams.FLAG_SECURE) }'
          copy='        val saved = instrumentation.uiAutomation.executeShellCommand("sh -c \'mkdir -p /sdcard/Download; run-as com.tryitexclusive.nativepilot cat files/premium_" + name + ".png > /sdcard/Download/tryit_premium_" + name + ".png\'")\n        android.os.ParcelFileDescriptor.AutoCloseInputStream(saved).use { it.readBytes() }\n'
          assert marker in s
          p.write_text(s.replace(marker,copy+marker))
          PY
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            cd tryit-native-phase-a && gradle --no-daemon :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.tryitexclusive.nativepilot.NativePilotUiTest#capturePremiumScreensFromIsolatedFixture
            mkdir -p premium-previews
            for name in dashboard workspace login; do adb pull /sdcard/Download/tryit_premium_$name.png premium-previews/$name.png; done
      - uses: actions/upload-artifact@v4
        with:
          name: TRYIT-Premium-Design-Previews
          path: premium-previews/*.png
          if-no-files-found: error
