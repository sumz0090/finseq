name: Build TRYIT APK

on:
  push:
    branches:
      - tryit-apk-20261006
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android SDK 35
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0" >/dev/null
      - name: Build debug APK
        working-directory: tryit-android
        run: gradle --no-daemon :app:assembleDebug
      - name: Prepare artifact
        run: cp tryit-android/app/build/outputs/apk/debug/app-debug.apk TRYIT.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TRYIT-APK
          path: TRYIT.apk
          if-no-files-found: error
