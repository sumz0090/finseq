name: Build FINSEQ CMS APK

on:
  push:
    branches: [ main, finseq-cms-v3.0.5.2-build2 ]
    paths:
      - 'FINSEQ_CMS_Android/**'
      - '.github/workflows/build-finseq-cms-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: finseq-cms-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KS_B64_A: ${{ secrets.FINSEQ_CMS_KEYSTORE_BASE64 }}
      KS_B64_B: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KS_B64_C: ${{ secrets.KEYSTORE_BASE64 }}
      KS_PASS_A: ${{ secrets.FINSEQ_CMS_KEYSTORE_PASSWORD }}
      KS_PASS_B: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KS_PASS_C: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS_A: ${{ secrets.FINSEQ_CMS_KEY_ALIAS }}
      KEY_ALIAS_B: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_ALIAS_C: ${{ secrets.KEY_ALIAS }}
      KEY_PASS_A: ${{ secrets.FINSEQ_CMS_KEY_PASSWORD }}
      KEY_PASS_B: ${{ secrets.ANDROID_KEY_PASSWORD }}
      KEY_PASS_C: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK 35
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Validate v3.0.5.2 source
        working-directory: FINSEQ_CMS_Android
        run: |
          grep -q "versionCode 362" app/build.gradle
          grep -q "versionName '3.0.5.2'" app/build.gradle
          grep -q 'android:usesCleartextTraffic="false"' app/src/main/AndroidManifest.xml
          grep -q 'cleartextTrafficPermitted="false"' app/src/main/res/xml/network_security_config.xml
      - name: Normalize PNG resources for compiler
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont
          res=Path('FINSEQ_CMS_Android/app/src/main/res')
          def logo(size, transparent=False):
              bg=(255,255,255,0) if transparent else (255,255,255,255)
              im=Image.new('RGBA',(size,size),bg); d=ImageDraw.Draw(im); navy=(16,46,86,255)
              d.rounded_rectangle((int(size*.08),int(size*.08),int(size*.92),int(size*.92)),radius=max(4,int(size*.12)),fill=navy)
              text='FINSEQ'
              try: font=ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf',max(10,int(size*.16)))
              except Exception: font=ImageFont.load_default()
              box=d.textbbox((0,0),text,font=font); tw,th=box[2]-box[0],box[3]-box[1]
              d.text(((size-tw)/2,(size-th)/2),text,font=font,fill='white')
              return im
          (res/'drawable').mkdir(parents=True,exist_ok=True)
          logo(512,True).save(res/'drawable/finseq_icon_master.png','PNG')
          logo(900,True).save(res/'drawable/finseq_company_logo_transparent.png','PNG')
          for folder,size in [('mipmap-mdpi',48),('mipmap-hdpi',72),('mipmap-xhdpi',96),('mipmap-xxhdpi',144),('mipmap-xxxhdpi',192)]:
              out=res/folder/'ic_launcher.png'; out.parent.mkdir(parents=True,exist_ok=True); logo(size).save(out,'PNG')
          PY
      - name: Build FINSEQ CMS v3.0.5.2 release APK
        working-directory: FINSEQ_CMS_Android
        run: gradle --no-daemon clean :app:assembleRelease
      - name: Prepare and production-sign APK when secrets exist
        run: |
          set -e
          mkdir -p out
          UNSIGNED="FINSEQ_CMS_Android/app/build/outputs/apk/release/app-release-unsigned.apk"
          test -f "$UNSIGNED"
          cp "$UNSIGNED" out/FINSEQ_CMS_V3_0_5_2_RELEASE_UNSIGNED.apk
          KS_B64="${KS_B64_A:-${KS_B64_B:-${KS_B64_C:-}}}"
          KS_PASS="${KS_PASS_A:-${KS_PASS_B:-${KS_PASS_C:-}}}"
          KEY_ALIAS_VALUE="${KEY_ALIAS_A:-${KEY_ALIAS_B:-${KEY_ALIAS_C:-}}}"
          KEY_PASS_VALUE="${KEY_PASS_A:-${KEY_PASS_B:-${KEY_PASS_C:-$KS_PASS}}}"
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ] && [ -n "$KEY_ALIAS_VALUE" ]; then
            printf '%s' "$KS_B64" | base64 -d > /tmp/finseq-release.jks
            "$ANDROID_HOME/build-tools/35.0.0/zipalign" -p -f 4 "$UNSIGNED" /tmp/finseq-aligned.apk
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks /tmp/finseq-release.jks --ks-key-alias "$KEY_ALIAS_VALUE" --ks-pass "pass:$KS_PASS" --key-pass "pass:$KEY_PASS_VALUE" --out out/FINSEQ_CMS_V3_0_5_2_PRODUCTION_SIGNED.apk /tmp/finseq-aligned.apk
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs out/FINSEQ_CMS_V3_0_5_2_PRODUCTION_SIGNED.apk | tee out/signature-verification.txt
            "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging out/FINSEQ_CMS_V3_0_5_2_PRODUCTION_SIGNED.apk | head -30 | tee out/apk-badging.txt
            sha256sum out/*.apk > out/SHA256SUMS.txt
          else
            echo 'Production signing secrets unavailable in GitHub Actions.' | tee out/SIGNING_NOT_AVAILABLE.txt
            "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$UNSIGNED" | head -30 | tee out/apk-badging.txt
            sha256sum out/*.apk > out/SHA256SUMS.txt
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: FINSEQ-CMS-V3.0.5.2-APK
          path: out/
          if-no-files-found: error
          compression-level: 0
