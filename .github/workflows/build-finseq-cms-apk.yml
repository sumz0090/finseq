name: Build FINSEQ CMS APK

on:
  push:
    branches: [ main ]
    paths:
      - 'FINSEQ_CMS_Android/**'
      - '.github/workflows/build-finseq-cms-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finseq-cms-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK 35
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'

      - name: Apply FINSEQ CMS v3.0.5.2 source patch
        working-directory: FINSEQ_CMS_Android
        run: python3 apply_v3052_bundle.py

      - name: Normalize FINSEQ Android PNG resources
        working-directory: FINSEQ_CMS_Android
        run: |
          python3 -m pip install --disable-pip-version-check pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image

          res = Path('app/src/main/res')
          targets = [
              res/'drawable/finseq_icon_master.png',
              res/'drawable/finseq_company_logo_transparent.png',
              res/'mipmap-mdpi/ic_launcher.png',
              res/'mipmap-hdpi/ic_launcher.png',
              res/'mipmap-xhdpi/ic_launcher.png',
              res/'mipmap-xxhdpi/ic_launcher.png',
              res/'mipmap-xxxhdpi/ic_launcher.png',
          ]
          for p in targets:
              im = Image.open(p).convert('RGBA')
              im.save(p, format='PNG', optimize=True, compress_level=9)

          master = Image.open(res/'drawable/finseq_icon_master.png').convert('RGBA')
          sizes = {
              'mipmap-mdpi/ic_launcher.png': 48,
              'mipmap-hdpi/ic_launcher.png': 72,
              'mipmap-xhdpi/ic_launcher.png': 96,
              'mipmap-xxhdpi/ic_launcher.png': 144,
              'mipmap-xxxhdpi/ic_launcher.png': 192,
          }
          for rel, size in sizes.items():
              icon = master.copy()
              icon.thumbnail((size, size), Image.Resampling.LANCZOS)
              canvas = Image.new('RGBA', (size, size), (0,0,0,0))
              canvas.alpha_composite(icon, ((size-icon.width)//2, (size-icon.height)//2))
              canvas.save(res/rel, format='PNG', optimize=True, compress_level=9)
          print('FINSEQ PNG resources normalized')
          PY

      - name: Verify release metadata
        working-directory: FINSEQ_CMS_Android
        run: |
          grep -q 'versionCode 362' app/build.gradle
          grep -q "versionName '3.0.5.2'" app/build.gradle
          grep -q 'android:usesCleartextTraffic="false"' app/src/main/AndroidManifest.xml
          ! grep -q 'cleartextTrafficPermitted="true"' app/src/main/res/xml/network_security_config.xml

      - name: Build FINSEQ CMS v3.0.5.2 release APK
        working-directory: FINSEQ_CMS_Android
        run: gradle --no-daemon clean :app:assembleRelease

      - name: Prepare APK
        run: |
          set -e
          mkdir -p out
          UNSIGNED="FINSEQ_CMS_Android/app/build/outputs/apk/release/app-release-unsigned.apk"
          test -f "$UNSIGNED"
          cp "$UNSIGNED" out/FINSEQ_CMS_V3_0_5_2_RELEASE_UNSIGNED.apk
          sha256sum out/FINSEQ_CMS_V3_0_5_2_RELEASE_UNSIGNED.apk > out/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: FINSEQ-CMS-V3.0.5.2-APK
          path: out/
          if-no-files-found: error
          compression-level: 0

      - name: Publish unsigned APK for local production signing
        run: |
          set -e
          mkdir -p build-artifacts
          cp out/FINSEQ_CMS_V3_0_5_2_RELEASE_UNSIGNED.apk build-artifacts/FINSEQ_CMS_V3_0_5_2_RELEASE_UNSIGNED.apk
          cp out/SHA256SUMS.txt build-artifacts/FINSEQ_CMS_V3_0_5_2_RELEASE_UNSIGNED.sha256.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add build-artifacts/FINSEQ_CMS_V3_0_5_2_RELEASE_UNSIGNED.apk build-artifacts/FINSEQ_CMS_V3_0_5_2_RELEASE_UNSIGNED.sha256.txt
          git diff --cached --quiet || git commit -m 'artifact: FINSEQ CMS v3.0.5.2 unsigned APK'
          git push
