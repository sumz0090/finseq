name: Build FINSEQ CMS APK

on:
  push:
    branches: [ main ]
    paths:
      - 'FINSEQ_CMS_Android/**'
      - '.github/workflows/build-finseq-cms-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finseq-cms-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK 35
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'

      - name: Apply FINSEQ CMS v3.0.5.2 source patch
        working-directory: FINSEQ_CMS_Android
        run: python3 apply_v3052_bundle.py

      - name: Fix v3.0.5.2 generated Java compile issue
        working-directory: FINSEQ_CMS_Android
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/in/finseq/insurance/ActiveSessionsActivity.java')
          s=p.read_text()
          old='revoke.setOnClickListener(v->confirmRevoke(id,title));'
          new='final String sessionTitle=title;revoke.setOnClickListener(v->confirmRevoke(id,sessionTitle));'
          if old not in s:
              raise SystemExit('ActiveSessions lambda target not found')
          p.write_text(s.replace(old,new))
          print('ActiveSessions lambda fixed')
          PY

      - name: Replace malformed FINSEQ image resources
        working-directory: FINSEQ_CMS_Android
        run: |
          set -e
          rm -f app/src/main/res/drawable/finseq_icon_master.png
          rm -f app/src/main/res/drawable/finseq_company_logo_transparent.png
          rm -f app/src/main/res/mipmap-mdpi/ic_launcher.png
          rm -f app/src/main/res/mipmap-hdpi/ic_launcher.png
          rm -f app/src/main/res/mipmap-xhdpi/ic_launcher.png
          rm -f app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          rm -f app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          mkdir -p app/src/main/res/mipmap-anydpi
          cat > app/src/main/res/drawable/finseq_icon_master.xml <<'XML'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="512dp" android:height="512dp"
              android:viewportWidth="512" android:viewportHeight="512">
              <path android:fillColor="#00658C" android:pathData="M140,180 L200,180 L200,350 L170,385 L140,350 Z"/>
              <path android:fillColor="#00658C" android:pathData="M220,120 L280,120 L280,380 L250,420 L220,380 Z"/>
              <path android:fillColor="#00658C" android:pathData="M300,60 L360,60 L360,315 L330,350 L300,315 Z"/>
              <path android:fillColor="#555555" android:pathData="M70,325 C135,330 190,370 250,440 C305,340 365,255 455,205 C375,260 315,345 250,470 C190,390 135,350 70,345 Z"/>
          </vector>
          XML
          cat > app/src/main/res/drawable/finseq_company_logo_transparent.xml <<'XML'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="900dp" android:height="300dp"
              android:viewportWidth="900" android:viewportHeight="300">
              <path android:fillColor="#00658C" android:pathData="M90,105 L125,105 L125,210 L107,232 L90,210 Z"/>
              <path android:fillColor="#00658C" android:pathData="M135,70 L170,70 L170,225 L152,248 L135,225 Z"/>
              <path android:fillColor="#00658C" android:pathData="M180,35 L215,35 L215,190 L197,212 L180,190 Z"/>
              <path android:fillColor="#555555" android:pathData="M45,195 C85,198 120,220 152,260 C190,190 230,135 290,105 C235,142 195,195 152,280 C118,235 84,213 45,210 Z"/>
              <path android:fillColor="#00658C" android:pathData="M310,92 L340,92 L340,230 L310,230 Z M350,92 L378,92 L378,230 L350,230 Z M390,92 L420,92 L455,175 L455,92 L485,92 L485,230 L455,230 L420,145 L420,230 L390,230 Z M500,92 L530,92 L530,230 L500,230 Z M545,92 L640,92 L640,120 L575,120 L575,145 L630,145 L630,173 L575,173 L575,202 L642,202 L642,230 L545,230 Z"/>
              <path android:fillColor="#555555" android:pathData="M690,80 C750,80 790,115 790,160 C790,205 750,240 690,240 C630,240 590,205 590,160 C590,115 630,80 690,80 Z M690,106 C650,106 622,128 622,160 C622,192 650,214 690,214 C730,214 758,192 758,160 C758,128 730,106 690,106 Z"/>
              <path android:fillColor="#00658C" android:pathData="M670,168 L680,168 L680,200 L670,194 Z M685,150 L695,150 L695,200 L685,200 Z M700,132 L710,132 L710,190 L700,200 Z"/>
          </vector>
          XML
          cp app/src/main/res/drawable/finseq_icon_master.xml app/src/main/res/mipmap-anydpi/ic_launcher.xml

      - name: Verify release metadata
        working-directory: FINSEQ_CMS_Android
        run: |
          grep -q 'versionCode 362' app/build.gradle
          grep -q "versionName '3.0.5.2'" app/build.gradle
          grep -q 'android:usesCleartextTraffic="false"' app/src/main/AndroidManifest.xml
          ! grep -q 'cleartextTrafficPermitted="true"' app/src/main/res/xml/network_security_config.xml

      - name: Build FINSEQ CMS v3.0.5.2 release APK
        working-directory: FINSEQ_CMS_Android
        run: gradle --no-daemon clean :app:assembleRelease

      - name: Prepare APK
        run: |
          set -e
          mkdir -p out
          UNSIGNED="FINSEQ_CMS_Android/app/build/outputs/apk/release/app-release-unsigned.apk"
          test -f "$UNSIGNED"
          cp "$UNSIGNED" out/FINSEQ_CMS_V3_0_5_2_RELEASE_UNSIGNED.apk
          sha256sum out/FINSEQ_CMS_V3_0_5_2_RELEASE_UNSIGNED.apk > out/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: FINSEQ-CMS-V3.0.5.2-APK
          path: out/
          if-no-files-found: error
          compression-level: 0

      - name: Publish unsigned APK for local production signing
        run: |
          set -e
          mkdir -p build-artifacts
          cp out/FINSEQ_CMS_V3_0_5_2_RELEASE_UNSIGNED.apk build-artifacts/FINSEQ_CMS_V3_0_5_2_RELEASE_UNSIGNED.apk
          cp out/SHA256SUMS.txt build-artifacts/FINSEQ_CMS_V3_0_5_2_RELEASE_UNSIGNED.sha256.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add build-artifacts/FINSEQ_CMS_V3_0_5_2_RELEASE_UNSIGNED.apk build-artifacts/FINSEQ_CMS_V3_0_5_2_RELEASE_UNSIGNED.sha256.txt
          git diff --cached --quiet || git commit -m 'artifact: FINSEQ CMS v3.0.5.2 unsigned APK'
          git push
