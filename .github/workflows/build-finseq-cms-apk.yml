name: Build FINSEQ CMS APK

on:
  push:
    branches: [ main ]
    paths:
      - 'FINSEQ_CMS_Android/**'
      - '.github/workflows/build-finseq-cms-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version
      - name: Install Android SDK 35
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Apply Attendance Phase 2 source patch
        working-directory: FINSEQ_CMS_Android
        run: python3 apply_attendance_phase2.py
      - name: Build FINSEQ CMS Debug APK
        working-directory: FINSEQ_CMS_Android
        run: gradle --no-daemon :app:assembleDebug
      - name: Prepare APK
        run: |
          cp FINSEQ_CMS_Android/app/build/outputs/apk/debug/app-debug.apk FINSEQ_CMS_V3_0_4_4_INTERNAL_CAMERA.apk
          ls -lh FINSEQ_CMS_V3_0_4_4_INTERNAL_CAMERA.apk
      - uses: actions/upload-artifact@v4
        with:
          name: FINSEQ-CMS-V3.0.4.4-Internal-Camera
          path: FINSEQ_CMS_V3_0_4_4_INTERNAL_CAMERA.apk
          if-no-files-found: error
