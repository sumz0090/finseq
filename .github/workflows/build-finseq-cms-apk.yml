name: Build FINSEQ CMS APK

on:
  push:
    branches: [ main ]
    paths:
      - 'FINSEQ_CMS_Android/**'
      - '.github/workflows/build-finseq-cms-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: finseq-cms-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export-toolchain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK 35
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Export and split local build toolchain
        run: |
          mkdir -p toolchain
          GRADLE_BIN="$(command -v gradle)"
          GRADLE_HOME="$(cd "$(dirname "$GRADLE_BIN")/.." && pwd)"
          tar -czf /tmp/gradle-8.9.tar.gz -C "$(dirname "$GRADLE_HOME")" "$(basename "$GRADLE_HOME")"
          tar -czf /tmp/android-sdk-35.tar.gz -C "$ANDROID_HOME" build-tools/35.0.0 platforms/android-35 licenses
          split -b 90M -d -a 2 /tmp/gradle-8.9.tar.gz toolchain/gradle.part.
          split -b 90M -d -a 2 /tmp/android-sdk-35.tar.gz toolchain/sdk.part.
          ls -lh toolchain
      - uses: actions/upload-artifact@v4
        with:
          name: FINSEQ-Gradle-Part-00
          path: toolchain/gradle.part.00
          if-no-files-found: error
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: FINSEQ-Gradle-Part-01
          path: toolchain/gradle.part.01
          if-no-files-found: error
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: FINSEQ-SDK-Part-00
          path: toolchain/sdk.part.00
          if-no-files-found: error
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: FINSEQ-SDK-Part-01
          path: toolchain/sdk.part.01
          if-no-files-found: error
          compression-level: 0
