name: Build FINSEQ Attendance APK

on:
  push:
    branches: [ main ]
    paths:
      - 'FINSEQ_Attendance_Android/**'
      - '.github/workflows/build-finseq-attendance-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK 35
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'

      - name: Prepare FINSEQ F-Q branding and FaceNet
        run: |
          mkdir -p FINSEQ_Attendance_Android/app/src/main/res/drawable FINSEQ_Attendance_Android/app/src/main/assets
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image,ImageDraw,ImageFont
          root=Path('FINSEQ_Attendance_Android/app/src/main/res/drawable')
          NAVY=(0,49,88,255); WHITE=(255,255,255,255); TRANS=(0,0,0,0)
          bold='/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf'
          regular='/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf'
          def ficon(size):
              im=Image.new('RGBA',(size,size),TRANS); d=ImageDraw.Draw(im); m=int(size*.08); r=int(size*.18)
              d.rounded_rectangle((m,m,size-m,size-m),radius=r,fill=NAVY)
              x=int(size*.30); y=int(size*.23); w=int(size*.16)
              d.rounded_rectangle((x,y,x+w,int(size*.78)),radius=int(size*.035),fill=WHITE)
              d.rounded_rectangle((x,y,int(size*.72),y+w),radius=int(size*.035),fill=WHITE)
              d.rounded_rectangle((x,int(size*.45),int(size*.63),int(size*.45)+w),radius=int(size*.035),fill=WHITE)
              d.polygon([(int(size*.43),int(size*.55)),(int(size*.70),int(size*.42)),(int(size*.54),int(size*.67))],fill=NAVY)
              return im
          def qicon(size):
              im=Image.new('RGBA',(size,size),TRANS); d=ImageDraw.Draw(im); m=int(size*.08); r=int(size*.18)
              d.rounded_rectangle((m,m,size-m,size-m),radius=r,fill=NAVY)
              d.ellipse((int(size*.23),int(size*.20),int(size*.77),int(size*.74)),outline=WHITE,width=int(size*.075))
              d.line((int(size*.61),int(size*.62),int(size*.79),int(size*.80)),fill=WHITE,width=int(size*.075))
              return im
          icon=ficon(1024); icon.save(root/'finseq_icon_master.png',format='PNG',optimize=True)
          logo=Image.new('RGBA',(1800,360),TRANS); logo.alpha_composite(ficon(260),(20,50)); logo.alpha_composite(qicon(260),(1515,50))
          d=ImageDraw.Draw(logo); d.text((315,62),'FINSEQ',font=ImageFont.truetype(bold,150),fill=NAVY); d.text((320,228),'FINANCIAL SERVICES',font=ImageFont.truetype(regular,34),fill=NAVY)
          logo.save(root/'finseq_company_logo_transparent.png',format='PNG',optimize=True)
          for n in ('finseq_icon_master.png','finseq_company_logo_transparent.png'):
              x=Image.open(root/n); x.verify(); print(n,'PASS')
          PY
          grep -q '@drawable/finseq_icon_master' FINSEQ_Attendance_Android/app/src/main/res/drawable/ic_launcher_foreground.xml
          grep -q 'android:icon="@mipmap/ic_launcher"' FINSEQ_Attendance_Android/app/src/main/AndroidManifest.xml
          grep -q 'android:roundIcon="@mipmap/ic_launcher_round"' FINSEQ_Attendance_Android/app/src/main/AndroidManifest.xml
          grep -q 'android:screenOrientation="fullSensor"' FINSEQ_Attendance_Android/app/src/main/AndroidManifest.xml
          curl -L --fail --retry 3 -o FINSEQ_Attendance_Android/app/src/main/assets/facenet.tflite https://raw.githubusercontent.com/shubham0204/FaceRecognition_With_FaceNet_Android/master/app/src/main/assets/facenet.tflite
          test -s FINSEQ_Attendance_Android/app/src/main/assets/facenet.tflite

      - name: Apply compile-safe JSON patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('FINSEQ_Attendance_Android/app/src/main/java/in/finseq/attendance/MainActivity.java')
          s=p.read_text(encoding='utf-8')
          old='static JSONArray json(double[]v){JSONArray a=new JSONArray();for(double x:v)a.put(x);return a;}'
          new='static JSONArray json(double[]v){JSONArray a=new JSONArray();for(double x:v){try{a.put(x);}catch(JSONException e){a.put(0);}}return a;}'
          if old not in s: raise SystemExit('JSONArray anchor missing')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY

      - name: Apply attendance patches
        working-directory: FINSEQ_Attendance_Android
        run: |
          python3 apply_liveness_v1_1.py
          python3 apply_v1_2_recognition.py
          python3 apply_v1_2_operator.py
          python3 apply_v1_2_auto_enroll.py
          python3 apply_v1_2_secure_routes.py
          python3 apply_v1_2_branding.py
          python3 apply_v1_3_premium_ui.py
          python3 apply_v1_3_2_stability.py
          python3 apply_v1_4_pin_enrollment.py
          python3 apply_v1_4_1_fast_engine.py

      - name: Verify source invariants
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('FINSEQ_Attendance_Android/app/src/main/java/in/finseq/attendance/MainActivity.java').read_text(encoding='utf-8')
          checks={
            'official logo':'finseq_company_logo_transparent' in s,
            'PIN enrollment':'/api/attendance/secure/pin-verify' in s and '6-digit Enrollment PIN' in s,
            'live ImageAnalysis':'ImageAnalysis imageAnalysis' in s and 'STRATEGY_KEEP_ONLY_LATEST' in s,
            'FaceNet':'FaceEmbeddingModel embedder' in s,
            '4-frame consensus':'fastWindow.size()<4' in s,
            'liveness':'live_multiframe_motion' in s and 'live_blink' in s,
            'cooldown':'last_person_id' in s and 'last_submit_at' in s,
            'rotation':'imageAnalysis.setTargetRotation(rotation)' in s,
            'dynamic version':'BuildConfig.VERSION_NAME' in s,
          }
          for k,v in checks.items(): print(k,'PASS' if v else 'FAIL')
          bad=[k for k,v in checks.items() if not v]
          if bad: raise SystemExit('Failed checks: '+', '.join(bad))
          PY

      - name: Build APK
        working-directory: FINSEQ_Attendance_Android
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify packaged logo, launcher and manifest
        run: |
          APK=FINSEQ_Attendance_Android/app/build/outputs/apk/debug/app-debug.apk
          python3 - <<'PY'
          import io,zipfile
          from PIL import Image
          apk='FINSEQ_Attendance_Android/app/build/outputs/apk/debug/app-debug.apk'
          with zipfile.ZipFile(apk) as z:
              names=set(z.namelist())
              req={'res/drawable/finseq_company_logo_transparent.png','res/drawable/finseq_icon_master.png','res/drawable/ic_launcher_foreground.xml','res/mipmap-anydpi-v26/ic_launcher.xml','res/mipmap-anydpi-v26/ic_launcher_round.xml'}
              missing=req-names
              if missing: raise SystemExit('Missing resources: '+str(missing))
              for n in ('res/drawable/finseq_company_logo_transparent.png','res/drawable/finseq_icon_master.png'):
                  im=Image.open(io.BytesIO(z.read(n))); im.verify(); print(n,'PNG PASS')
          PY
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump resources "$APK" > /tmp/resources.txt
          grep -q 'finseq_icon_master' /tmp/resources.txt
          grep -q 'finseq_company_logo_transparent' /tmp/resources.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump xmltree "$APK" --file AndroidManifest.xml > /tmp/manifest.txt
          grep -q 'android:icon' /tmp/manifest.txt
          grep -q 'android:roundIcon' /tmp/manifest.txt
          grep -q 'android:screenOrientation' /tmp/manifest.txt
          grep -q 'android:configChanges' /tmp/manifest.txt
          echo 'Packaged FINSEQ logo + launcher + rotation PASS'

      - name: Prepare APK
        run: |
          cp FINSEQ_Attendance_Android/app/build/outputs/apk/debug/app-debug.apk FINSEQ_ATTENDANCE_V1_4_2_FAST_OFFICIAL_LOGO.apk
          ls -lh FINSEQ_ATTENDANCE_V1_4_2_FAST_OFFICIAL_LOGO.apk

      - uses: actions/upload-artifact@v4
        with:
          name: FINSEQ-Attendance-V1.4.2-Fast-Official-Logo
          path: FINSEQ_ATTENDANCE_V1_4_2_FAST_OFFICIAL_LOGO.apk
          if-no-files-found: error
