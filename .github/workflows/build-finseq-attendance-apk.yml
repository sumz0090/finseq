name: Build FINSEQ Attendance APK

on:
  push:
    branches: [ main ]
    paths:
      - 'FINSEQ_Attendance_Android/**'
      - '.github/workflows/build-finseq-attendance-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK 35
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build FINSEQ Attendance APK
        working-directory: FINSEQ_Attendance_Android
        run: gradle --no-daemon :app:assembleDebug
      - name: Prepare APK
        run: |
          cp FINSEQ_Attendance_Android/app/build/outputs/apk/debug/app-debug.apk FINSEQ_ATTENDANCE_V1_0_0.apk
          ls -lh FINSEQ_ATTENDANCE_V1_0_0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: FINSEQ-Attendance-V1.0.0
          path: FINSEQ_ATTENDANCE_V1_0_0.apk
          if-no-files-found: error
