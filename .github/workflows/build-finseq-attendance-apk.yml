name: Build FINSEQ Attendance APK

on:
  push:
    branches: [ main ]
    paths:
      - 'FINSEQ_Attendance_Android/**'
      - '.github/workflows/build-finseq-attendance-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK 35
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Prepare and sanitize FINSEQ logo, adaptive icon and FaceNet model
        run: |
          mkdir -p FINSEQ_Attendance_Android/app/src/main/res/drawable
          mkdir -p FINSEQ_Attendance_Android/app/src/main/assets
          cp FINSEQ_CMS_Android/app/src/main/res/drawable/finseq_company_logo_transparent.png FINSEQ_Attendance_Android/app/src/main/res/drawable/finseq_company_logo_transparent_source.png
          cp FINSEQ_CMS_Android/app/src/main/res/drawable/finseq_icon_master.png FINSEQ_Attendance_Android/app/src/main/res/drawable/finseq_icon_master_source.png
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageFile
          ImageFile.LOAD_TRUNCATED_IMAGES=True
          root=Path('FINSEQ_Attendance_Android/app/src/main/res/drawable')
          for src,dst in [
              ('finseq_company_logo_transparent_source.png','finseq_company_logo_transparent.png'),
              ('finseq_icon_master_source.png','finseq_icon_master.png'),
          ]:
              im=Image.open(root/src).convert('RGBA')
              im.save(root/dst,format='PNG',optimize=True)
              check=Image.open(root/dst); check.verify()
              print(dst, 'sanitized OK')
          (root/'finseq_company_logo_transparent_source.png').unlink()
          (root/'finseq_icon_master_source.png').unlink()
          PY
          curl -L --fail --retry 3 -o FINSEQ_Attendance_Android/app/src/main/assets/facenet.tflite https://raw.githubusercontent.com/shubham0204/FaceRecognition_With_FaceNet_Android/master/app/src/main/assets/facenet.tflite
          test -s FINSEQ_Attendance_Android/app/src/main/assets/facenet.tflite
      - name: Apply compile-safe JSON patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('FINSEQ_Attendance_Android/app/src/main/java/in/finseq/attendance/MainActivity.java')
          s=p.read_text(encoding='utf-8')
          old='static JSONArray json(double[]v){JSONArray a=new JSONArray();for(double x:v)a.put(x);return a;}'
          new='static JSONArray json(double[]v){JSONArray a=new JSONArray();for(double x:v){try{a.put(x);}catch(JSONException e){a.put(0);}}return a;}'
          if old not in s:
              raise SystemExit('Expected JSONArray method not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Apply liveness anti-spoof patch
        working-directory: FINSEQ_Attendance_Android
        run: python3 apply_liveness_v1_1.py
      - name: Apply FaceNet recognition and consensus
        working-directory: FINSEQ_Attendance_Android
        run: python3 apply_v1_2_recognition.py
      - name: Apply enrollment operator compatibility
        working-directory: FINSEQ_Attendance_Android
        run: python3 apply_v1_2_operator.py
      - name: Apply automatic face enrollment
        working-directory: FINSEQ_Attendance_Android
        run: python3 apply_v1_2_auto_enroll.py
      - name: Apply secure FaceNet endpoints
        working-directory: FINSEQ_Attendance_Android
        run: python3 apply_v1_2_secure_routes.py
      - name: Apply FINSEQ branding and welcome
        working-directory: FINSEQ_Attendance_Android
        run: python3 apply_v1_2_branding.py
      - name: Apply approved premium UI
        working-directory: FINSEQ_Attendance_Android
        run: python3 apply_v1_3_premium_ui.py
      - name: Apply stability, rotation and state bug fixes
        working-directory: FINSEQ_Attendance_Android
        run: python3 apply_v1_3_2_stability.py
      - name: Apply v1.4 staff-specific PIN enrollment
        working-directory: FINSEQ_Attendance_Android
        run: python3 apply_v1_4_pin_enrollment.py
      - name: Verify v1.4 source invariants
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('FINSEQ_Attendance_Android/app/src/main/java/in/finseq/attendance/MainActivity.java')
          s=p.read_text(encoding='utf-8')
          checks={
            'PIN endpoint':'/api/attendance/secure/pin-verify' in s,
            '6-digit PIN UI':'6-digit Enrollment PIN' in s,
            'FaceNet consensus':'CONSENSUS_FRAMES=4' in s,
            'second-best margin':'MIN_SECOND_BEST_MARGIN=0.08' in s,
            'dynamic version':'BuildConfig.VERSION_NAME' in s,
            'persistent cooldown':'last_person_id' in s and 'last_submit_at' in s,
            'enrollment cancel guard':'enrollmentActive' in s and 'activeEnrollmentUserId' in s,
            'fresh profile sync':'Refreshing authorized face profiles' in s,
            'stale GPS rejection':'120000L' in s,
            'front camera required':'LENS_FACING_FRONT' in s,
            'EXIF rotation':'applyExifRotation' in s,
          }
          bad=[k for k,v in checks.items() if not v]
          for k,v in checks.items(): print(k, 'PASS' if v else 'FAIL')
          if bad: raise SystemExit('Source invariant failures: '+', '.join(bad))
          PY
      - name: Build FINSEQ Attendance APK
        working-directory: FINSEQ_Attendance_Android
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify packaged icon, manifest and orientation
        run: |
          APK=FINSEQ_Attendance_Android/app/build/outputs/apk/debug/app-debug.apk
          python3 - <<'PY'
          import io, zipfile
          from PIL import Image
          apk='FINSEQ_Attendance_Android/app/build/outputs/apk/debug/app-debug.apk'
          with zipfile.ZipFile(apk) as z:
              names=set(z.namelist())
              required={
                'res/drawable/finseq_icon_master.png',
                'res/drawable/finseq_company_logo_transparent.png',
                'res/mipmap-anydpi-v26/ic_launcher.xml',
                'res/mipmap-anydpi-v26/ic_launcher_round.xml',
              }
              missing=required-names
              if missing: raise SystemExit(f'Missing packaged resources: {missing}')
              for name in ['res/drawable/finseq_icon_master.png','res/drawable/finseq_company_logo_transparent.png']:
                  im=Image.open(io.BytesIO(z.read(name))); im.verify(); print(name,'PNG verify PASS')
          PY
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump xmltree "$APK" --file AndroidManifest.xml > /tmp/manifest.txt
          grep -q 'android:icon' /tmp/manifest.txt
          grep -q 'ic_launcher' /tmp/manifest.txt
          grep -q 'android:roundIcon' /tmp/manifest.txt
          grep -q 'fullSensor' /tmp/manifest.txt
          echo 'Manifest launcher icon + rotation verification PASS'
      - name: Prepare APK
        run: |
          cp FINSEQ_Attendance_Android/app/build/outputs/apk/debug/app-debug.apk FINSEQ_ATTENDANCE_V1_4_0_PRODUCTION_CANDIDATE.apk
          ls -lh FINSEQ_ATTENDANCE_V1_4_0_PRODUCTION_CANDIDATE.apk
      - uses: actions/upload-artifact@v4
        with:
          name: FINSEQ-Attendance-V1.4.0-Production-Candidate
          path: FINSEQ_ATTENDANCE_V1_4_0_PRODUCTION_CANDIDATE.apk
          if-no-files-found: error
