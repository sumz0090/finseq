name: Build FINSEQ Attendance APK

on:
  push:
    branches: [ main ]
    paths:
      - 'FINSEQ_Attendance_Android/**'
      - '.github/workflows/build-finseq-attendance-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK 35
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Apply compile-safe JSON patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('FINSEQ_Attendance_Android/app/src/main/java/in/finseq/attendance/MainActivity.java')
          s=p.read_text(encoding='utf-8')
          old='static JSONArray json(double[]v){JSONArray a=new JSONArray();for(double x:v)a.put(x);return a;}'
          new='static JSONArray json(double[]v){JSONArray a=new JSONArray();for(double x:v){try{a.put(x);}catch(JSONException e){a.put(0);}}return a;}'
          if old not in s:
              raise SystemExit('Expected JSONArray method not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Apply liveness anti-spoof patch
        working-directory: FINSEQ_Attendance_Android
        run: python3 apply_liveness_v1_1.py
      - name: Build FINSEQ Attendance APK
        working-directory: FINSEQ_Attendance_Android
        run: gradle --no-daemon :app:assembleDebug
      - name: Prepare APK
        run: |
          cp FINSEQ_Attendance_Android/app/build/outputs/apk/debug/app-debug.apk FINSEQ_ATTENDANCE_V1_1_0_LIVENESS.apk
          ls -lh FINSEQ_ATTENDANCE_V1_1_0_LIVENESS.apk
      - uses: actions/upload-artifact@v4
        with:
          name: FINSEQ-Attendance-V1.1.0-Liveness
          path: FINSEQ_ATTENDANCE_V1_1_0_LIVENESS.apk
          if-no-files-found: error
