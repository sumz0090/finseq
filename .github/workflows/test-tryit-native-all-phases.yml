name: Verify TRYIT Native All Phases
on:
  push:
    branches: [tryit-native-phase-a-20261010]
    paths:
      - 'tryit-native-phase-a/allphases_patch/**'
      - 'tryit-native-phase-a/allphases_tests/**'
      - 'tryit-native-phase-a/app/**'
      - 'tryit-native-phase-a/.gitattributes'
      - '.github/workflows/test-tryit-native-all-phases.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s allphases_tests -v
        working-directory: tryit-native-phase-a
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        profile: [pixel_2, pixel_c]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: ${{ matrix.profile }}
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: cd tryit-native-phase-a && gradle --no-daemon :app:connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Native-UI-QA-${{ matrix.profile }}
          path: tryit-native-phase-a/app/build/reports/androidTests
