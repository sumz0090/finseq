name: Build TRYIT Mobile Fix APK

on:
  push:
    branches:
      - tryit-apk-build-20261010
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android SDK 35
        shell: bash
        run: |
          SDKROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$SDKROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$SDKROOT/cmdline-tools/16.0/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Build APK
        working-directory: tryit-apk-mobilefix
        run: gradle --no-daemon :app:assembleDebug
      - name: Prepare APK
        run: cp tryit-apk-mobilefix/app/build/outputs/apk/debug/app-debug.apk TRYIT_WebApp_v1.0.1_MobileFix.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TRYIT-MobileFix-APK
          path: TRYIT_WebApp_v1.0.1_MobileFix.apk
          if-no-files-found: error
