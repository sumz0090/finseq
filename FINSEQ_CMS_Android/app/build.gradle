plugins { id 'com.android.application' }

def keyPropertiesFile = rootProject.file('keystore.properties')
def keyProperties = new Properties()
if (keyPropertiesFile.exists()) {
    keyPropertiesFile.withInputStream { keyProperties.load(it) }
}

android {
    namespace 'in.finseq.insurance'
    compileSdk 35
    buildFeatures { buildConfig true }
    defaultConfig {
        applicationId 'in.finseq.insurance'
        minSdk 26
        targetSdk 35
        versionCode 362
        versionName '3.0.5.2'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    signingConfigs {
        release {
            if (keyPropertiesFile.exists()) {
                storeFile rootProject.file(keyProperties['storeFile'])
                storePassword keyProperties['storePassword']
                keyAlias keyProperties['keyAlias']
                keyPassword keyProperties['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            debuggable false
            minifyEnabled false
            if (keyPropertiesFile.exists()) signingConfig signingConfigs.release
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'androidx.fragment:fragment:1.8.5'
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'androidx.camera:camera-core:1.4.2'
    implementation 'androidx.camera:camera-camera2:1.4.2'
    implementation 'androidx.camera:camera-lifecycle:1.4.2'
    implementation 'androidx.camera:camera-view:1.4.2'
}
